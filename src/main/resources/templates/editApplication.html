<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/defaultLayout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Create Job Application</title>
</head>
<body>
<div layout:fragment="content">
    <form method="post" action="#" th:action="@{/applications/updateApplication}" th:object="${jobApplication}">
        <h1>Edit job Application</h1>

        <!--To add applicationID and accountId to the object-->
        <input type="hidden" th:field="*{applicationID}">
        <input type="hidden" th:field="*{accountID}">

        <label for="company">Company</label>
        <input type="text" th:field="*{company}" id="company" name="company">

        <label for="role">Role</label>
        <input type="text" th:field="*{role}" id="role" name="role">

        <label for="status">Status</label>
        <select th:field="*{status}" id="status" name="status">
            <option th:each="status : ${statuses}" th:value="${status.name()}" th:text="${status.name().toLowerCase()}">
        </select>

        <label for="location">Location</label>
        <input type="text" th:field="*{location}" id="location" name="location">

        <label for="dateApplied">Date Applied</label>
        <input type="date" th:field="*{dateApplied}" id="dateApplied" name="dateApplied">

        <button type="submit">Update</button>
    </form>
</div>
</body>
</html>

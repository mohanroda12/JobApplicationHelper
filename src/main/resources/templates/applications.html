<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/defaultLayout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Applications</title>
</head>
<body>
<div layout:fragment="content">

    <form method="post" action="#" th:action="@{/applications/search/role}" th:object="${searchModel}">

        <label for="searchInput">Role</label>
        <input type="text" th:field="*{searchTerm}"  id="searchInput" name="searchInput" placeholder="search by role...">
        <button type="submit">Search</button>
    </form>

    <table>

        <thead>
            <tr>
                <th>Company</th>
                <th>Role</th>
                <th>Application status</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="jobApplication : ${applications}">
                <td th:text="${jobApplication.company}">Company</td>
                <td th:text="${jobApplication.role}">Company</td>
                <td th:text="${jobApplication.status}">Company</td>
            </tr>
        </tbody>

    </table>
</div>
</body>

</html>
